<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KRISTOLE</title>
    <!-- light PWA: "Add to Home Screen" opens the game without the browser bars; no offline cache, so it always loads the latest version -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="KRISTOLE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #050505; overflow: hidden;
        /* no page scroll / pinch zoom / long-press menus on phones: the game handles every touch */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      /* keep the picture off the notch and the home bar */
      #wrap {
        position: fixed; inset: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      .overlay {
        position: fixed; inset: 0; z-index: 20; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #050505; color: #efeee9; font: bold 22px/1.4 Georgia, serif; text-align: center; padding: 24px;
      }
      .overlay .big { font-size: 64px; }
      /* phones and tablets held upright: ask to turn */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      #install {
        position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
        z-index: 15; display: none; align-items: center; gap: 14px;
        background: #efeee9; color: #111; border: 3px solid #111; border-radius: 10px;
        padding: 8px 10px 8px 16px; font: 16px/1.3 Georgia, serif; max-width: 92vw;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      }
      #install button { font: bold 22px Georgia, serif; background: none; border: 0; padding: 4px 8px; color: #111; }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="game"></div></div>
    <div id="rotate" class="overlay"><div class="big">⟳</div><div>Turn your phone sideways to play</div></div>
    <div id="install">
      <span>Full screen: tap <b>Share</b> <span aria-hidden="true">⬆︎</span>, then <b>Add to Home Screen</b></span>
      <button type="button" aria-label="Close">✕</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
